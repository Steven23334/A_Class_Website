<!doctype html>
<html lang="zh-CN">

<head>
  <!-- 版本号：每次改 KEYS / SALT / 页面内容时，把这个值改一下（随便写，和上次不同即可） -->
  <meta name="x-ver" content="2026-11-04-01" />

  <!-- 免缓存：命中缓存时 fetch 最新 HTML，版本号不同才原地替换，URL 不变 -->
  <script>
    (function () {
      try {
        if (location.protocol !== 'http:' && location.protocol !== 'https:') return;

        var nav = performance.getEntriesByType &&
          performance.getEntriesByType('navigation')[0];

        // 只有“从缓存加载”才处理；首次访问/强刷直接跳过
        if (!nav || nav.transferSize !== 0 || nav.decodedBodySize === 0) return;

        // 防死循环：document.write 重写后脚本会再执行一次，这时直接退出
        if (sessionStorage.getItem('sd801.chk') === '1') {
          sessionStorage.removeItem('sd801.chk');
          return;
        }
        sessionStorage.setItem('sd801.chk', '1');

        var curMeta = document.querySelector('meta[name="x-ver"]');
        var curVer = curMeta ? curMeta.getAttribute('content') : '';

        // 无缓存拉取服务器上的最新 HTML（不带 hash，避免把 #gen 丢掉）
        fetch(location.pathname + location.search, {
          cache: 'no-store',
          credentials: 'same-origin'
        })
          .then(function (r) { return r.text(); })
          .then(function (html) {
            var m = html.match(/<meta\s+name=["']x-ver["']\s+content=["']([^"']*)["']/i);
            var newVer = m ? m[1] : '';

            if (newVer && newVer !== curVer) {
              // 服务器版本更新了：原地替换文档，URL 不变
              document.open();
              document.write(html);
              document.close();
            } else {
              // 版本一致，什么都不做（不闪烁）
              sessionStorage.removeItem('sd801.chk');
            }
          })
          .catch(function () {
            // 网络异常就正常显示缓存内容
            sessionStorage.removeItem('sd801.chk');
          });
      } catch (e) { /* 忽略 */ }
    })();
  </script>

  <link rel="icon" href="image/favicon.ico" type="image/x-icon" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>特供入口 - 萧山尚德801班</title>
  <link rel="stylesheet" href="css/main_css.css" />
  <script src="js/site-layout.js" defer></script>
</head>

<body data-page="secret">
  <div class="container">
    <h2>特供入口</h2>

    <div class="hero">
      <p>输入口令即可进入对应区域。</p>

      <form class="secret-form" id="secretForm" autocomplete="off" novalidate>
        <div class="secret-field">
          <input class="secret-input" id="secretInput" type="password" placeholder="请输入口令" aria-label="口令"
            autocomplete="off" spellcheck="false" maxlength="128" />
          <button class="secret-eye" id="secretEye" type="button" aria-label="显示口令" title="显示/隐藏">👁</button>
        </div>
        <button class="secret-btn" id="secretBtn" type="submit">进入</button>
      </form>

      <p class="secret-msg" id="secretMsg" role="status" aria-live="polite"></p>
      <p class="secret-hint">口令由站长保管，忘了去班里问问。</p>
    </div>

    <!-- ===== 口令哈希生成器（访问 secret.html#gen 才显示） ===== -->
    <div id="genBox" hidden>
      <h2>口令哈希生成器（站长专用）</h2>
      <div class="hero">
        <p>输入新口令，生成后复制结果替换 <code>KEYS</code> 里对应项。</p>
        <form class="secret-form" id="genForm" autocomplete="off" novalidate>
          <input class="secret-input" id="genInput" type="text" placeholder="新口令" autocomplete="off" />
          <button class="secret-btn" type="submit">生成</button>
        </form>
        <p class="secret-msg" id="genMsg"></p>
        <textarea class="secret-out" id="genOut" rows="4" readonly placeholder="生成结果会显示在这里"></textarea>
        <p class="secret-hint">盐：<code id="saltShow"></code>（要和 secret.html 里 <code>SALT</code> 一致）</p>
        <p class="secret-hint">当前版本：<code id="verShow"></code></p>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      /* ==================== 配置区（只改这里） ==================== */
      // 盐：换口令时不用动；想更保险可以改成一个随机字符串，然后重新生成所有 hash
      var SALT = 'sd801-2026';

      // 每条口令存的是 sha256(SALT + ':' + 明文) 的结果。
      // 加/改口令：访问 secret.html#gen 生成新 hash 粘进来。
      // ⚠️ 改完这里，记得把 <head> 里的 <meta name="x-ver"> 也改一下，否则缓存不刷新
      var KEYS = [
        { hash: 'f1643bdab1295900fbf0925a1ccf00dee91b682315d18e4cb8fc59790dbeb3f5', url: 'vip.html' }
      ];

      // 会话存储键名 & 有效期
      var SESSION_KEY = 'sd801.sess.v2';
      var TTL_MS = 30 * 60 * 1000;   // 30 分钟

      // 失败限流
      var MAX_ATTEMPTS = 5;
      var LOCK_SECONDS = 30;

      // 口令输入长度限制
      var MIN_LEN = 1;
      var MAX_LEN = 128;
      /* ======================================================= */

      /* ---------- SHA-256（纯 JS，http/file 环境也能用） ---------- */
      function sha256Hex(input) {
        var K = [
          0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
          0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
          0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
          0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
          0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
          0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
          0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
          0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2
        ];
        var H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
        var bytes = [];
        for (var i = 0; i < input.length; i++) {
          var c = input.charCodeAt(i);
          if (c < 0x80) bytes.push(c);
          else if (c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 63));
          else if (c < 0xd800 || c >= 0xe000) bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
          else {
            i++;
            var c2 = input.charCodeAt(i) || 0;
            var cp = 0x10000 + (((c & 0x3ff) << 10) | (c2 & 0x3ff));
            bytes.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 63), 0x80 | ((cp >> 6) & 63), 0x80 | (cp & 63));
          }
        }
        var bitLen = bytes.length * 8;
        bytes.push(0x80);
        while (bytes.length % 64 !== 56) bytes.push(0);
        var hi = Math.floor(bitLen / 0x100000000), lo = bitLen >>> 0;
        bytes.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255);
        bytes.push((lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);

        function rotr(x, n) { return (x >>> n) | (x << (32 - n)); }

        for (var off = 0; off < bytes.length; off += 64) {
          var w = new Array(64);
          for (var j = 0; j < 16; j++) {
            w[j] = (bytes[off + j * 4] << 24) | (bytes[off + j * 4 + 1] << 16) | (bytes[off + j * 4 + 2] << 8) | bytes[off + j * 4 + 3];
          }
          for (var j2 = 16; j2 < 64; j2++) {
            var s0 = rotr(w[j2 - 15], 7) ^ rotr(w[j2 - 15], 18) ^ (w[j2 - 15] >>> 3);
            var s1 = rotr(w[j2 - 2], 17) ^ rotr(w[j2 - 2], 19) ^ (w[j2 - 2] >>> 10);
            w[j2] = (w[j2 - 16] + s0 + w[j2 - 7] + s1) | 0;
          }
          var a = H[0], b = H[1], c3 = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
          for (var r = 0; r < 64; r++) {
            var S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
            var ch = (e & f) ^ (~e & g);
            var t1 = (h + S1 + ch + K[r] + w[r]) | 0;
            var S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
            var maj = (a & b) ^ (a & c3) ^ (b & c3);
            var t2 = (S0 + maj) | 0;
            h = g; g = f; f = e; e = (d + t1) | 0;
            d = c3; c3 = b; b = a; a = (t1 + t2) | 0;
          }
          H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c3) | 0; H[3] = (H[3] + d) | 0;
          H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
        }
        return H.map(function (x) { return (x >>> 0).toString(16).padStart(8, '0'); }).join('');
      }

      function hashPassword(pw) { return sha256Hex(SALT + ':' + pw); }

      /* ---------- 常量时间字符串比较 ---------- */
      function safeEqual(a, b) {
        if (typeof a !== 'string' || typeof b !== 'string') return false;
        if (a.length !== b.length) return false;
        var r = 0;
        for (var i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i);
        return r === 0;
      }

      /* ---------- 随机 token ---------- */
      function randomToken() {
        try {
          var buf = new Uint8Array(16);
          crypto.getRandomValues(buf);
          return Array.prototype.map.call(buf, function (x) {
            return ('0' + x.toString(16)).slice(-2);
          }).join('');
        } catch (e) {
          return Math.random().toString(36).slice(2) + Date.now().toString(36);
        }
      }

      /* ---------- 会话读写（localStorage：同源跨标签页共享，带 TTL） ---------- */
      function readSession() {
        try {
          var raw = localStorage.getItem(SESSION_KEY);
          if (!raw) return null;
          var s = JSON.parse(raw);
          if (!s || !s.t || !s.e || !s.u) return null;
          if (Date.now() > s.e) { localStorage.removeItem(SESSION_KEY); return null; }
          return s;
        } catch (e) { return null; }
      }
      function writeSession(url) {
        var s = { t: randomToken(), e: Date.now() + TTL_MS, u: url };
        try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch (e) { }
        return s;
      }
      function clearSession() {
        try { localStorage.removeItem(SESSION_KEY); } catch (e) { }
      }
      /* ---------- 只接受同源 URL，防手写 sessionStorage 注入 ---------- */
      function safeUrl(u) {
        try {
          if (typeof u !== 'string' || !u) return 'secret.html';
          var url = new URL(u, location.href);
          if (url.origin !== location.origin) return 'secret.html';
          return url.pathname + url.search + url.hash;
        } catch (e) {
          return 'secret.html';
        }
      }

      /* ---------- 匹配口令 ---------- */
      function match(input) {
        var h = hashPassword(input);
        for (var i = 0; i < KEYS.length; i++) {
          if (safeEqual(KEYS[i].hash, h)) return KEYS[i].url;
        }
        return null;
      }

      /* ==================== 页面初始化 ==================== */
      var form = document.getElementById('secretForm');
      var input = document.getElementById('secretInput');
      var btn = document.getElementById('secretBtn');
      var msg = document.getElementById('secretMsg');
      var eye = document.getElementById('secretEye');

      var attempts = 0, locked = false;

      function setMsg(text, type) {
        msg.textContent = text;
        msg.className = 'secret-msg' + (type ? ' ' + type : '');
      }

      // 已有有效会话：只给“直接进入”链接，不自动跳
      var sess = readSession();
      if (sess) {
        var tip = document.createElement('p');
        tip.className = 'secret-hint';
        tip.appendChild(document.createTextNode('上次验证仍然有效，'));

        var a = document.createElement('a');
        a.className = 'link-plain';
        a.href = safeUrl(sess.u);
        a.textContent = '直接进入';

        tip.appendChild(a);
        msg.parentNode.appendChild(tip);
      }

      // 显示/隐藏口令
      eye.addEventListener('click', function () {
        var isPw = input.type === 'password';
        input.type = isPw ? 'text' : 'password';
        eye.textContent = isPw ? '🙈' : '👁';
        eye.setAttribute('aria-label', isPw ? '隐藏口令' : '显示口令');
        input.focus();
      });

      // 提交
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        if (locked) return;

        var value = input.value.trim();

        if (!value) {
          setMsg('请先输入口令。', 'error');
          input.focus();
          return;
        }
        if (value.length < MIN_LEN) {
          setMsg('口令太短。', 'error');
          input.focus();
          return;
        }
        if (value.length > MAX_LEN) {
          setMsg('口令太长。', 'error');
          input.focus();
          return;
        }

        btn.disabled = true;
        btn.textContent = '验证中…';

        setTimeout(function () {
          var target = match(value);

          if (target) {
            setMsg('口令正确，正在进入…', 'ok');
            writeSession(target);
            setTimeout(function () { location.href = target; }, 350);
            return;
          }

          attempts++;
          input.value = '';
          input.focus();

          if (attempts >= MAX_ATTEMPTS) {
            startLock();
          } else {
            setMsg('口令不对（还剩 ' + (MAX_ATTEMPTS - attempts) + ' 次机会）', 'error');
            btn.disabled = false;
            btn.textContent = '进入';
          }
        }, 60);
      });

      function startLock() {
        locked = true;
        var left = LOCK_SECONDS;
        btn.disabled = true;
        setMsg('尝试次数过多，请 ' + left + ' 秒后再试。', 'error');

        var timer = setInterval(function () {
          left--;
          if (left <= 0) {
            clearInterval(timer);
            locked = false;
            attempts = 0;
            btn.disabled = false;
            btn.textContent = '进入';
            setMsg('可以重新尝试了。');
            return;
          }
          setMsg('尝试次数过多，请 ' + left + ' 秒后再试。', 'error');
        }, 1000);
      }

      /* ==================== 生成器（#gen） ==================== */
      var genBox = document.getElementById('genBox');
      if (location.hash === '#gen') {
        genBox.hidden = false;
        document.getElementById('saltShow').textContent = SALT;

        var verMeta = document.querySelector('meta[name="x-ver"]');
        var verShow = document.getElementById('verShow');
        if (verShow) verShow.textContent = verMeta ? verMeta.getAttribute('content') : '（未设置）';

        var genForm = document.getElementById('genForm');
        var genInput = document.getElementById('genInput');
        var genOut = document.getElementById('genOut');
        var genMsg = document.getElementById('genMsg');

        genForm.addEventListener('submit', function (e) {
          e.preventDefault();
          var v = genInput.value;
          if (!v) {
            genMsg.textContent = '先输入口令。';
            genMsg.className = 'secret-msg error';
            return;
          }
          var h = hashPassword(v);
          genOut.value =
            "{ hash: '" + h + "', url: 'vip.html' },";
          genMsg.textContent = '已生成。替换 KEYS 后，别忘了改 <meta name="x-ver"> 的版本号。';
          genMsg.className = 'secret-msg ok';
        });
      }
    })();
  </script>
</body>

</html>
